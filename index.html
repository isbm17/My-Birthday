<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi cumpleaños</title>

    <style>
        body {
          background-color: #0b0b0b;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

      .invitacion {
    max-width: 500px;
    margin: 0 auto;
    padding: 60px 30px;
    background-color: #ffd6e7;
    border: 3px solid #ff69a6;
    border-radius: 25px;
    box-shadow: 8px 8px 0px #111;
}

.mini-titulo {
    color: #111;
    font-size: 14px;
    letter-spacing: 4px;
}

h1 {
    color: #ff2f92;
    font-size: 65px;
    line-height: 0.9;
    margin: 25px 0;
}

.nombre {
    color: #111;
    font-size: 28px;
    letter-spacing: 8px;
    font-weight: bold;
}

.frase {
    color: #444;
    font-size: 17px;
    margin-top: 30px;

    .entrada {
    min-height: 80vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.entrada .mini-titulo {
    color: #ff69a6;
    font-size: 14px;
    letter-spacing: 4px;
    font-weight: bold;
}

.entrada .pequeno {
    color: #f5b6d2;
    font-size: 12px;
    margin-top: 25px;
}

.entrada h1 {
    color: white;
    font-size: 42px;
    margin: 20px 0 10px;
}

.entrada > p:not(.mini-titulo) {
    color: #f5dce8;
    font-size: 18px;
}

.entrada input {
    width: 280px;
    padding: 15px;
    margin: 20px 0;
    border: 2px solid #ff69a6;
    border-radius: 30px;
    background-color: #111;
    color: white;
    text-align: center;
    font-size: 16px;
    outline: none;
}

.entrada input::placeholder {
    color: #999;
}

.entrada button {
    padding: 14px 30px;
    border: 2px solid #ff69a6;
    border-radius: 30px;
    background-color: #ff69a6;
    color: white;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
}
    </style>
</head>

<body>

    <div class="entrada">
        <p class="mini-titulo">✦ BIENVENIDA ✦</p>

        <h1>Antes de comenzar...</h1>

        <p>¿Cuál es tu nombre?</p>

        <input type="text" id="nombre" placeholder="Escribe tu nombre...">

        <button onclick="entrar()">ENTRAR →</button>

        <p class="pequeno">Una invitación creada especialmente para ti ♡</p>
    </div>

</body>
</html>
