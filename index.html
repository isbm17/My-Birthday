<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi cumpleaños</title>

    <style>
        body {
            background-color: #f5e6ff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

      .invitacion {
    max-width: 500px;
    margin: 0 auto;
    padding: 60px 30px;
    background-color: #ffd6e7;
    border: 3px solid #ff69a6;
    border-radius: 25px;
    box-shadow: 8px 8px 0px #111;
}

.mini-titulo {
    color: #111;
    font-size: 14px;
    letter-spacing: 4px;
}

h1 {
    color: #ff2f92;
    font-size: 65px;
    line-height: 0.9;
    margin: 25px 0;
}

.nombre {
    color: #111;
    font-size: 28px;
    letter-spacing: 8px;
    font-weight: bold;
}

.frase {
    color: #444;
    font-size: 17px;
    margin-top: 30px;
}
    </style>
</head>

<body>

    <div class="invitacion">

        <p class="mini-titulo">YOU'RE INVITED TO</p>

        <h1>MY<br>BIRTHDAY</h1>

        <p class="nombre">ISABELLA</p>

        <p class="frase">Una noche para celebrar, reír y crear recuerdos.</p>

    </div>

</body>
</html>
